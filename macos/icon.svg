<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#2a1f5c"/>
      <stop offset="0.6" stop-color="#151033"/>
      <stop offset="1" stop-color="#0a0818"/>
    </radialGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd9a0"/>
      <stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a65"/>
      <stop offset="1" stop-color="#e5487a"/>
    </linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b55cd6"/>
      <stop offset="1" stop-color="#6c3fd1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- one plate: rounded rhombus centred on (0,0); translated per layer -->
  <g stroke-linejoin="round" stroke-width="36">
    <g transform="translate(512 640)">
      <path d="M0-120 L208 0 L0 120 L-208 0 Z" fill="#000" stroke="#000" opacity="0.45" filter="url(#shadow)" transform="translate(0 34)"/>
      <path d="M0-120 L208 0 L0 120 L-208 0 Z" fill="url(#p3)" stroke="url(#p3)"/>
    </g>
    <g transform="translate(512 545)">
      <path d="M0-120 L208 0 L0 120 L-208 0 Z" fill="#000" stroke="#000" opacity="0.4" filter="url(#shadow)" transform="translate(0 30)"/>
      <path d="M0-120 L208 0 L0 120 L-208 0 Z" fill="url(#p2)" stroke="url(#p2)"/>
    </g>
    <g transform="translate(512 450)">
      <path d="M0-120 L208 0 L0 120 L-208 0 Z" fill="#000" stroke="#000" opacity="0.4" filter="url(#shadow)" transform="translate(0 30)"/>
      <path d="M0-120 L208 0 L0 120 L-208 0 Z" fill="url(#p1)" stroke="url(#p1)"/>
    </g>
  </g>

  <g transform="translate(512 300)">
    <path d="M0-120 C12-30 30-12 120 0 C30 12 12 30 0 120 C-12 30-30 12-120 0 C-30-12-12-30 0-120 Z" fill="#fff4d6" filter="url(#glow)" opacity="0.8"/>
    <path d="M0-120 C12-30 30-12 120 0 C30 12 12 30 0 120 C-12 30-30 12-120 0 C-30-12-12-30 0-120 Z" fill="#fffaf0"/>
  </g>
</svg>
